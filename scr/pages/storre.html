<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstore</title>
    <script src="../js/varibles.js" defer></script>
    <script src="../js/temp/bookCard.js" defer></script>
    <Script src="../js/script.js" defer></Script>

    <link rel="stylesheet" href="../style/components/fonts.css">
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../style/components/card.css">
    <link rel="stylesheet" href="../style/components/input.css">
    <link rel="stylesheet" href="../style/components/button.css">
    <link rel="stylesheet" href="../style/components/table.css">


</head>

<body>
    <article class="book-card">
        <header class="card-headline">
            <h2>Fourth Wing – Flammengeküsst</h2>
        </header>

        <img class="card-picture" src="../assets/imgs/FourthWingFlammengeküsst.webp" alt="Platzhalter">

        <section class="card-content">
            <div>
                <p class="price">16.00 €</p>
                <div class="like-place">
                    <p>1250</p>
                    <button class="button-heart">
                        <svg class="heart" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M15.7 4C18.87 4 21 6.98 21 9.76C21 15.39 12.16 20 12 20C11.84 20 3 15.39 3 9.76C3 6.98 5.13 4 8.3 4C10.12 4 11.31 4.91 12 5.71C12.69 4.91 13.88 4 15.7 4Z" />
                        </svg>
                    </button>

                </div>

            </div>
            <table>
                <tr>
                    <th>Author :</th>
                    <td>Rebecca Yarros</td>
                </tr>
                <tr>
                    <th>Erscheinungsjahr :</th>
                    <td>2023</td>
                </tr>
                <tr>
                    <th>Genre :</th>
                    <td>Fantasy</td>
                </tr>
            </table>
        </section>
        <article>
            <table class="comment">
                <caption>Kommentare :</caption>
                <tr>
                    <th>Schreiber</th>
                    <td>Kommentare</td>
                </tr>
            </table>

        </article>
        <form action="">
            <input type="text">
            <button class="button-send">
                <svg class="send" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M20.7639 12H10.0556M3 8.00003H5.5M4 12H5.5M4.5 16H5.5M9.96153 12.4896L9.07002 15.4486C8.73252 16.5688 8.56376 17.1289 8.70734 17.4633C8.83199 17.7537 9.08656 17.9681 9.39391 18.0415C9.74792 18.1261 10.2711 17.8645 11.3175 17.3413L19.1378 13.4311C20.059 12.9705 20.5197 12.7402 20.6675 12.4285C20.7961 12.1573 20.7961 11.8427 20.6675 11.5715C20.5197 11.2598 20.059 11.0295 19.1378 10.5689L11.3068 6.65342C10.2633 6.13168 9.74156 5.87081 9.38789 5.95502C9.0808 6.02815 8.82627 6.24198 8.70128 6.53184C8.55731 6.86569 8.72427 7.42461 9.05819 8.54246L9.96261 11.5701C10.0137 11.7411 10.0392 11.8266 10.0493 11.9137C10.0583 11.991 10.0582 12.069 10.049 12.1463C10.0387 12.2334 10.013 12.3188 9.96153 12.4896Z" />
                </svg>
            </button>
        </form>





    </article>




</body>

</html>
